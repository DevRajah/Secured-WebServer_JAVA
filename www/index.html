<!DOCTYPE html>
<html>

<head>
    <title>Secure Web Server</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            margin-top: 100px;
        }

        form {
            background: white;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            margin: 10px;
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Secure Message Form</h1>

    <form method="POST" action="/submit">
        <input type="text" name="name" placeholder="Your name" required><br>
        <input type="text" name="message" placeholder="Your message" required><br>
        <button type="submit">Send</button>
    </form>

</body>

</html>
